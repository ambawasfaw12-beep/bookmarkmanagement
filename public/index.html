<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMark & Link Manager</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
   <h1>Bookmark Manager</h1>
    <div class="inputBox">
        <div class="box">
            <label for="title">Site:</label>
            <input type="text" id="title" placeholder="google">
        </div>

        <div class="box">
            <label for="link">Link:</label>
            <input type="text" id="link" placeholder="http://google.com">
        </div>



        <button id="addBtn">Add Bookmark</button>
    </div>

    <div class="container">
    </div>

    <script src="/index.js" type="module"></script>

</body>

</html>
